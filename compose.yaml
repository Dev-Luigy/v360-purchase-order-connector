# O nome fixo isola este stack: sem ele, o Compose deriva o projeto do nome do
# diretório, e um worktree ou uma cópia da pasta viraria outro projeto.
name: v360-purchase-order-connector

services:
  # Migração é etapa própria, executada antes da API subir. Sem ela,
  # `docker compose up` entregava serviço e banco vazio: o avaliador recebia
  # 200 em /ready e 500 em todo endpoint de negócio (REVIEW-02, achado 1).
  # A API nunca cria nem altera schema no start.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://v360:v360@db:5432/v360
    depends_on:
      db:
        condition: service_healthy
    # Não verificado contra container real: ENV-03. Se o CLI precisar de
    # diretório gravável, é aqui que aparece.
    user: node
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://v360:v360@db:5432/v360
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: v360
      POSTGRES_PASSWORD: v360
      POSTGRES_DB: v360
    ports:
      - '127.0.0.1:${DB_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U v360 -d v360']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
